name: Build Kernel

on:
  push:
    branches:
      - android17-aptusitu

  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - lmi

      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true

      target_os:
        description: 'Target OS (目标系统)'
        required: true
        default: 'miui'
        type: choice
        options:
          - aosp
          - miui
          - both

      release:
        description: 'Publish to GitHub Releases (发布到 Releases)'
        required: true
        type: boolean
        default: true

  schedule:
    - cron: '13 12 * * 1-6'
    - cron: '59 14 * * 0'

env:
  CCACHE_DIR: ~/.cache/ccache_mikernel
  CCACHE_MAXSIZE: 10G
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6

  # Final visible kernel release
  KERNELRELEASE_OVERRIDE_BASE: '5.15.325-Ikun-KirinNova'

  # This only enables the spoof mode.
  # It does NOT change the source tree's real VERSION/PATCHLEVEL/SUBLEVEL.
  SPOOF_KERNEL_VERSION: 'true'
  SPOOFED_KERNEL_VERSION: '5.15.325'

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device || 'alioth' }} | KSU:${{ github.event.inputs.ksu || true }} | OS:${{ github.event.inputs.target_os || 'miui' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Environment
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex gawk git gnupg gperf \
            imagemagick libncurses-dev lib32z1-dev liblz4-tool \
            libsdl1.2-compat-dev libssl-dev libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            dwarves libelf-dev

      - name: Cache zyc-clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/zyc-clang
          key: zyc-clang-16.0.6-20260510

      - name: Setup zyc-clang 16 Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"

          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz

          tar -zxvf Clang-16.0.6-20260510.tar.gz
          rm -f Clang-16.0.6-20260510.tar.gz

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'alioth' }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'alioth' }}-
            ${{ runner.os }}-kernel-ccache-

      - name: Configure ccache & Print Pre-Build Stats
        shell: bash
        run: |
          set -euo pipefail

          ccache -M "${CCACHE_MAXSIZE}"
          ccache -z

          echo "=== Pre-Build Ccache Stats ==="
          ccache -s

      - name: Modify kernel version string
        shell: bash
        run: |
          set -euo pipefail

          # Remove vendor/other suffixes and keep a local suffix.
          # The final KERNELRELEASE is still overridden below.
          sed -i 's|^EXTRAVERSION =.*|EXTRAVERSION = -Ikun-KirinNova|' Makefile

          find arch/arm64/configs -maxdepth 1 -type f -name "*defconfig" -print0 |
            while IFS= read -r -d '' file; do
              sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$file"
              printf '%s\n' 'CONFIG_LOCALVERSION_AUTO=n' >> "$file"

              sed -i '/CONFIG_LOCALVERSION=/d' "$file"
              printf '%s\n' 'CONFIG_LOCALVERSION=""' >> "$file"
            done

          printf '%s\n' '#!/bin/sh' > scripts/setlocalversion
          printf '%s\n' 'echo ""' >> scripts/setlocalversion
          chmod +x scripts/setlocalversion

      - name: Validate spoof configuration
        shell: bash
        run: |
          set -euo pipefail

          expected='5.15.325-Ikun-KirinNova'

          if [[ "${SPOOF_KERNEL_VERSION}" != 'true' ]]; then
            echo '[ERROR] SPOOF_KERNEL_VERSION must be true' >&2
            exit 1
          fi

          if [[ "${SPOOFED_KERNEL_VERSION}" != '5.15.325' ]]; then
            echo '[ERROR] SPOOFED_KERNEL_VERSION must be 5.15.325' >&2
            exit 1
          fi

          if [[ "${KERNELRELEASE_OVERRIDE_BASE}" != "$expected" ]]; then
            echo "[ERROR] Invalid KERNELRELEASE_OVERRIDE_BASE: ${KERNELRELEASE_OVERRIDE_BASE}" >&2
            echo "[ERROR] Expected: ${expected}" >&2
            exit 1
          fi

          echo "[+] Final kernel release will be: ${KERNELRELEASE_OVERRIDE_BASE}"

      - name: Apply KERNELRELEASE override to build script
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_kernel.sh")
          text = path.read_text()

          release_line = '        KERNELRELEASE="${KERNELRELEASE_OVERRIDE_BASE}"\n'

          if release_line not in text:
              marker = '        CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}"\n'
              if marker not in text:
                  raise SystemExit("[ERROR] Could not find MAKE_OPTS insertion point in build_kernel.sh")

              replacement = (
                  marker
                  + '        # Override only the final kernel release string.\n'
                  + '        # Do not modify VERSION/PATCHLEVEL/SUBLEVEL.\n'
                  + release_line
              )
              text = text.replace(marker, replacement, 1)

          olddefconfig_line = '    make "${MAKE_OPTS[@]}" olddefconfig\n'
          verify_block = (
              '    make "${MAKE_OPTS[@]}" olddefconfig\n'
              + '\n'
              + '    echo "[*] Verifying kernel release..."\n'
              + '    ACTUAL_KERNELRELEASE="$(make "${MAKE_OPTS[@]}" -s kernelrelease)"\n'
              + '    EXPECTED_KERNELRELEASE="${KERNELRELEASE_OVERRIDE_BASE}"\n'
              + '    echo "[*] Expected kernel release: ${EXPECTED_KERNELRELEASE}"\n'
              + '    echo "[*] Actual kernel release:   ${ACTUAL_KERNELRELEASE}"\n'
              + '    if [ "${ACTUAL_KERNELRELEASE}" != "${EXPECTED_KERNELRELEASE}" ]; then\n'
              + '        echo "[ERROR] Kernel release verification failed." >&2\n'
              + '        exit 1\n'
              + '    fi\n'
              + '    echo "[+] Kernel release verified: ${ACTUAL_KERNELRELEASE}"\n'
          )

          if 'ACTUAL_KERNELRELEASE="$(make "${MAKE_OPTS[@]}" -s kernelrelease)"' not in text:
              if olddefconfig_line not in text:
                  raise SystemExit("[ERROR] Could not find olddefconfig block in build_kernel.sh")
              text = text.replace(olddefconfig_line, verify_block, 1)

          path.write_text(text)
          print("[+] KERNELRELEASE override and validation inserted into build_kernel.sh")
          PY

          echo '=== KERNELRELEASE configuration ==='
          grep -n -A12 -B4 'KERNELRELEASE' build_kernel.sh

      - name: Run Build Script
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build_kernel.sh

          export PATH="$HOME/zyc-clang/bin:$PATH"
          export LOCALVERSION=""
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          DEVICE="${{ github.event.inputs.device || 'alioth' }}"
          KSU="${{ github.event.inputs.ksu || 'true' }}"
          TARGET_OS="${{ github.event.inputs.target_os || 'miui' }}"

          ARGS="$DEVICE"

          if [[ "$KSU" == 'true' ]]; then
            ARGS="$ARGS ksu"
          fi

          if [[ "$TARGET_OS" != 'both' ]]; then
            ARGS="$ARGS $TARGET_OS"
          fi

          echo "=== Build Configuration ==="
          echo "Device: ${DEVICE}"
          echo "KernelSU: ${KSU}"
          echo "Target OS: ${TARGET_OS}"
          echo "Kernel release: ${KERNELRELEASE_OVERRIDE_BASE}"
          echo "Command: ./build_kernel.sh ${ARGS}"
          echo "==========================="

          ./build_kernel.sh $ARGS

      - name: Print Post-Build Ccache Stats
        if: always()
        shell: bash
        run: |
          echo "=== Post-Build Ccache Stats ==="
          ccache -s

      - name: Upload Flashable ZIP (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DEBUG_APTKernel-${{ github.event.inputs.device || 'alioth' }}-${{ github.event.inputs.target_os || 'miui' }}-${{ github.run_id }}
          path: '*APTKernel_*.zip'
          compression-level: 0
          if-no-files-found: error

      - name: Publish Release
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          files: '*APTKernel_*.zip'
          tag_name: kernel-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_id }}
          name: "Kernel Build for ${{ github.event.inputs.device || 'alioth' }} (${{ github.event.inputs.target_os || 'miui' }})"
          body: |
            Automatic kernel build.

            - **Device:** ${{ github.event.inputs.device || 'alioth' }}
            - **KernelSU:** ${{ github.event.inputs.ksu || 'true' }}
            - **Target OS:** ${{ github.event.inputs.target_os || 'miui' }}
            - **Kernel release:** 5.15.325-Ikun-KirinNova
            - **Spoof mode:** final KERNELRELEASE only
            - **Compile-time VERSION/PATCHLEVEL/SUBLEVEL:** unchanged
          draft: false
          prerelease: false